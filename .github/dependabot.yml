version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 6
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: chore(actions)
    groups:
      github-actions:
        patterns:
          - "*"
