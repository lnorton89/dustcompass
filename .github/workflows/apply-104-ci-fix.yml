name: Apply 104 CI fix
on:
  push:
    branches: [fix/issue-104-data-schema-compat]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[104-ci-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-104-data-schema-compat
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/patch-104-ci.mjs
      - run: |
          rm scripts/patch-104-ci.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make schema compatibility fixtures complete [104-ci-applied]"
          git push origin HEAD:fix/issue-104-data-schema-compat
