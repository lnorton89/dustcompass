name: Apply 116 test fix
on:
  push:
    branches: [fix/issues-107-114]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[116-tests-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issues-107-114
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/patch-116-tests.mjs
      - run: |
          rm scripts/patch-116-tests.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: align regressions with issues 108 and 111 [116-tests-applied]"
          git push origin HEAD:fix/issues-107-114
