name: Apply async lint regression fixes

on:
  push:
    branches:
      - feature/directions-132

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/directions-132
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/fix-async-lint-regression-tests.mjs
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix async lint regression tests and PWA support state'
          git push origin HEAD:feature/directions-132
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
