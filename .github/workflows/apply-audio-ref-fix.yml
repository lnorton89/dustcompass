name: Apply audio ref fix
on:
  push:
    branches: [fix/issue-99-offline-audio-reload]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[audio-ref-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-99-offline-audio-reload
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/patch-audio-ref.mjs
      - run: |
          rm scripts/patch-audio-ref.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: type audio object URL ref [audio-ref-applied]"
          git push origin HEAD:fix/issue-99-offline-audio-reload
