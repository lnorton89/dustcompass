name: Apply geocode 116 repair
on:
  push:
    branches: [fix/issues-107-114]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[geocode-116-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issues-107-114
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: git fetch origin master
      - run: node scripts/repair-geocode-116.mjs
      - run: |
          rm -f scripts/repair-geocode-116.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve documented open-playa suffix safely [geocode-116-repaired]"
          git push origin HEAD:fix/issues-107-114
