name: Apply human E2E fixes
on:
  push:
    branches: [fix/human-e2e-findings-119-121]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[human-fixes-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/human-e2e-findings-119-121
      - name: Patch disclaimer surface and event search semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''  const footnoteRef = useCallback((node: HTMLElement | null) => {\n    if (!node) return\n    const observer = new ResizeObserver(() => setFootnoteHeight(node.offsetHeight))'''
          new = '''  const footnoteRef = useCallback((node: HTMLElement | null) => {\n    if (!node) {\n      setFootnoteHeight(0)\n      return\n    }\n    const observer = new ResizeObserver(() => setFootnoteHeight(node.offsetHeight))'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''  const [eventsOpen, setEventsOpen] = useState(false)\n  const [filtersOpen, setFiltersOpen] = useState(false)\n'''
          insert = '''  const [eventsOpen, setEventsOpen] = useState(false)\n  const [filtersOpen, setFiltersOpen] = useState(false)\n  // The large source/non-affiliation disclosure is useful once and costly on a\n  // phone forever. Its exact required text remains in FirstRun and Layers >\n  // About this map, so dismissing this overlay reclaims map space without\n  // hiding the disclosure from the app (#119).\n  const DISCLAIMER_SURFACE_KEY = 'dust-compass:disclaimer-surface:1'\n  const [disclaimerSurfaceDismissed, setDisclaimerSurfaceDismissed] = useState(false)\n  useEffect(() => {\n    try {\n      if (localStorage.getItem(DISCLAIMER_SURFACE_KEY) === 'dismissed') {\n        setDisclaimerSurfaceDismissed(true)\n      }\n    } catch {\n      /* blocked storage means the disclosure remains visible */\n    }\n  }, [])\n  const dismissDisclaimerSurface = useCallback(() => {\n    setDisclaimerSurfaceDismissed(true)\n    setFootnoteHeight(0)\n    try {\n      localStorage.setItem(DISCLAIMER_SURFACE_KEY, 'dismissed')\n    } catch {\n      /* the current-session dismissal still works */\n    }\n  }, [])\n'''
          assert marker in s
          s = s.replace(marker, insert, 1)

          start = '''              <Box\n                ref={footnoteRef}\n                data-testid="api-disclaimer"'''
          assert start in s
          s = s.replace(start, '''              {!disclaimerSurfaceDismissed && (\n              <Box\n                ref={footnoteRef}\n                data-testid="api-disclaimer"''', 1)

          style_marker = '''                  zIndex: 2,\n                  maxWidth: {'''
          assert style_marker in s
          s = s.replace(style_marker, '''                  zIndex: 2,\n                  display: 'flex',\n                  alignItems: 'center',\n                  gap: 0.25,\n                  maxWidth: {''', 1)

          text = '''                <Typography variant="caption" sx={{ display: 'block', lineHeight: 1.25 }}>\n                  City survey &amp; listings: Burning Man Project. {BRAND.disclaimer}\n                </Typography>\n              </Box>\n              {heading && navigation && ('''
          replacement = '''                <Typography variant="caption" sx={{ display: 'block', lineHeight: 1.25, flex: 1 }}>\n                  City survey &amp; listings: Burning Man Project. {BRAND.disclaimer}\n                </Typography>\n                <IconButton\n                  aria-label="Dismiss survey and disclaimer"\n                  onClick={dismissDisclaimerSurface}\n                  sx={{ pointerEvents: 'auto', width: 44, height: 44, flexShrink: 0 }}\n                >\n                  <CloseIcon fontSize="small" />\n                </IconButton>\n              </Box>\n              )}\n              {heading && navigation && ('''
          assert text in s
          s = s.replace(text, replacement, 1)
          p.write_text(s)

          p = Path('src/ui/EventsPanel.tsx')
          s = p.read_text()
          assert '          aria-label="Search events"\n' in s
          s = s.replace('          aria-label="Search events"\n', '', 1)
          old = '''          slotProps={{\n            input: {'''
          new = '''          slotProps={{\n            htmlInput: { 'aria-label': 'Search events' },\n            input: {'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('scripts/smoke.mjs')
          s = p.read_text()
          old = '''assert(await page.getByTestId('api-disclaimer').isVisible(), 'required API disclaimer is prominent')\n\n// The embargo notice is true for weeks before the event.'''
          new = '''const disclaimerSurface = page.getByTestId('api-disclaimer')\nassert(await disclaimerSurface.isVisible(), 'required API disclaimer is prominent on first view')\nassert(\n  (await disclaimerSurface.innerText()).includes('This app is not affiliated, endorsed, or verified by Burning Man Project.'),\n  'the visible disclosure contains the exact required non-affiliation text',\n)\nawait disclaimerSurface.getByRole('button', { name: 'Dismiss survey and disclaimer' }).click()\nawait page.waitForTimeout(250)\nassert((await disclaimerSurface.count()) === 0, 'the large disclaimer surface can be dismissed')\nawait page.reload({ waitUntil: 'load' })\nawait page.waitForFunction(() => window.__map, null, { timeout: 30000 })\nawait page.waitForTimeout(1200)\nassert((await disclaimerSurface.count()) === 0, 'disclaimer-surface dismissal persists across reload')\n// The exact legal/source disclosure remains reachable after the overlay is gone.\nawait page.keyboard.press('f')\nawait page.getByText('About this map', { exact: true }).waitFor({ timeout: 5000 })\nconst aboutMap = await page.locator('.MuiDrawer-paper').innerText()\nassert(\n  aboutMap.includes('This app is not affiliated, endorsed, or verified by Burning Man Project.'),\n  'required disclaimer remains available in Layers > About this map',\n)\nawait page.keyboard.press('Escape')\nawait page.waitForTimeout(300)\n\n// The embargo notice is true for weeks before the event.'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''await page.getByLabel('Show events').click()\nawait page.waitForTimeout(900)\nconst eventRows ='''
          new = '''await page.getByLabel('Show events').click()\nawait page.waitForTimeout(900)\nconst eventSearch = page.getByRole('textbox', { name: 'Search events' })\nassert((await eventSearch.count()) === 1, 'events search exposes its accessible name on the native textbox (#121)')\nconst eventRows ='''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/ui/EventsPanel.tsx scripts/smoke.mjs
          git commit -m "fix: address human E2E findings #119 and #121 [human-fixes-applied]"
          git push origin HEAD:fix/human-e2e-findings-119-121
