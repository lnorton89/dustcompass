name: Apply issue 104 patch

on:
  push:
    branches:
      - fix/issue-104-data-schema-compat

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-104-data-schema-compat
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/patch-issue-104.mjs
      - name: Commit generated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate live data refresh by schema compatibility (#104)'
          git push origin HEAD:fix/issue-104-data-schema-compat
