name: Apply issue 122
on:
  push:
    branches: [fix/human-e2e-findings-119-121]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue-122-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/human-e2e-findings-119-121
      - name: Apply address action fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''      if (poi) setPin(undefined)\n      else if (data) setPin({ position, address: addressFor(position, data.layout) })\n'''
          new = '''      if (poi) setPin(undefined)\n      else if (data) {\n        const address = addressFor(position, data.layout)\n        setPin({ position, address })\n        // Searching an address is the same human action as tapping bare playa:\n        // a fresh pin was just created, so expose Save/Share/Clear now rather\n        // than requiring the reader to discover that the marker can be tapped\n        // a second time (#122).\n        setProbe(address)\n      }\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/smoke.mjs')
          s = p.read_text()
          old = '''await page.getByRole('option', { name: /Esplanade & 7:30/ }).click()\nawait page.waitForTimeout(6500)\nconst overlappingPin = page.getByRole('button', { name: /Marked location: Esplanade & 7:30/ })\n'''
          new = '''await page.getByRole('option', { name: /Esplanade & 7:30/ }).click()\nawait page.waitForTimeout(400)\nassert(\n  (await page.getByRole('button', { name: /^Save$/ }).count()) > 0,\n  'selecting a searched address immediately exposes its Save action (#122)',\n)\n// The action bar may still auto-dismiss; the marker remains the recovery path.\nawait page.waitForTimeout(6500)\nconst overlappingPin = page.getByRole('button', { name: /Marked location: Esplanade & 7:30/ })\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx scripts/smoke.mjs
          git commit -m "fix: expose pin actions after address search (#122) [issue-122-applied]"
          git push origin HEAD:fix/human-e2e-findings-119-121
