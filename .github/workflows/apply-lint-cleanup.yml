name: Apply lint cleanup

on:
  push:
    branches:
      - feature/directions-132

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/directions-132
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: node scripts/maintenance-lint-codemod.mjs

      - name: Commit cleanup
        run: |
          # The default Actions token cannot modify workflow files. The codemod
          # stages the desired CI change and removes this one-shot workflow, but
          # those two workflow-file changes are applied afterward through the
          # GitHub connector. Keep them out of the bot-authenticated push.
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/apply-lint-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix strict lint violations'
          git push origin HEAD:feature/directions-132

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
