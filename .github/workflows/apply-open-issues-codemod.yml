name: Apply remaining issue fixes

on:
  push:
    branches:
      - fix/open-issues-160-167

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/open-issues-160-167
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/apply-open-issues-codemod.mjs
      - name: Commit generated edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/ui/EventsPanel.tsx
          git commit -m 'Fix unresolved directions and saved-event identity (#160 #164)'
          git push origin HEAD:fix/open-issues-160-167
