name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The city layout and listings are vendored from iBurn-Data rather than
      # committed, so tests that hold the geocoder against surveyed GPS need
      # them fetched first.
      - name: Fetch city data
        run: npm run fetch-data 2025

      - name: Typecheck
        run: npx tsc -b --force

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: |
          npx vite --port 5173 &
          npx wait-on -t 60000 http://127.0.0.1:5173/
          npm run test:smoke http://127.0.0.1:5173/
          npm run test:a11y  http://127.0.0.1:5173/

      - name: Offline test
        run: |
          npx vite preview --port 4173 &
          npx wait-on -t 60000 http://127.0.0.1:4173/
          npm run test:offline http://127.0.0.1:4173/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore
