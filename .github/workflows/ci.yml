name: CI

# Pull requests get one CI run from the pull_request event. Push CI is limited
# to master so feature-branch pushes do not create a second `CI / test` check
# for the same SHA. Duplicate push + pull_request checks can leave a cancelled
# push check attached to a PR head and block a protected merge even when the
# pull_request check is green.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch city geometry
        run: npm run fetch-data -- 2026

      - name: Fetch 2026 listings
        env:
          BURNING_MAN_API_KEY: ${{ secrets.BURNING_MAN_API_KEY }}
        run: npm run fetch-api -- 2026

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /dustcompass
          NEXT_PUBLIC_DATA_YEAR: '2026'
        run: npm run build

      - name: Start preview server
        id: start-server
        env:
          NEXT_PUBLIC_BASE_PATH: /dustcompass
        run: |
          node scripts/serve-export.mjs &
          npx wait-on -t 60000 http://127.0.0.1:4173/dustcompass/

      - name: Smoke tests
        if: ${{ !cancelled() && steps.start-server.outcome == 'success' }}
        run: npm run test:smoke http://127.0.0.1:4173/dustcompass/

      - name: Accessibility tests
        if: ${{ !cancelled() && steps.start-server.outcome == 'success' }}
        run: npm run test:a11y http://127.0.0.1:4173/dustcompass/

      - name: UI invariant tests
        if: ${{ !cancelled() && steps.start-server.outcome == 'success' }}
        run: npm run test:ui http://127.0.0.1:4173/dustcompass/

      - name: Offline tests
        if: ${{ !cancelled() && steps.start-server.outcome == 'success' }}
        run: npm run test:offline http://127.0.0.1:4173/dustcompass/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore
