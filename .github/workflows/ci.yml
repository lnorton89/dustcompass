name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch city geometry
        run: npm run fetch-data -- 2025

      - name: Fetch official archived listings
        run: npm run fetch-archive -- 2025

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /dustcompass
          NEXT_PUBLIC_DATA_YEAR: '2025'
          NEXT_PUBLIC_E2E: '1'
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production browser, accessibility, and offline tests
        env:
          NEXT_PUBLIC_BASE_PATH: /dustcompass
        run: |
          node scripts/serve-export.mjs &
          npx wait-on -t 60000 http://127.0.0.1:4173/dustcompass/
          npm run test:smoke http://127.0.0.1:4173/dustcompass/
          npm run test:a11y http://127.0.0.1:4173/dustcompass/
          npm run test:offline http://127.0.0.1:4173/dustcompass/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore
