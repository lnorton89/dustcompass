name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch city geometry
        run: npm run fetch-data -- 2025

      - name: Fetch official archived listings
        run: npm run fetch-archive -- 2025

      - name: Typecheck
        run: npx tsc -b --force

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: |
          npx vite --host 127.0.0.1 --port 5173 --strictPort &
          npx wait-on -t 60000 http://127.0.0.1:5173/
          npm run test:smoke http://127.0.0.1:5173/
          npm run test:a11y  http://127.0.0.1:5173/

      - name: Offline test
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          npx wait-on -t 60000 http://127.0.0.1:4173/
          npm run test:offline http://127.0.0.1:4173/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore
