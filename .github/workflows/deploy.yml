name: Deploy

on:
  push:
    # Filtered to the default branch by the job's `if` rather than a hardcoded
    # name, so this keeps working if the branch is ever renamed or merged.
    branches: ['**']
  # Lets you publish by hand without pushing.
  workflow_dispatch:
  # The listings keep moving after the last commit, and nobody is at a laptop
  # once the event starts. Two things make this necessary rather than tidy:
  # art locations stay embargoed until Gates open, so on the morning of 30
  # August the map gains 329 pieces it could not legally show the day before;
  # and camps add, move and cancel events right through the week.
  #
  # 07:15 UTC is 00:15 in Black Rock City, a quarter of an hour after the art
  # embargo lifts. 19:15 UTC is midday there, which picks up the day's changes
  # before the evening everyone actually uses this.
  schedule:
    - cron: '15 7 * * *'
    - cron: '15 19 * * *'

# Pages needs these; nothing else in this workflow writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Every deployment path, including workflow_dispatch, is restricted to the
    # repository's default branch. A manually dispatched feature branch must
    # never be able to replace the production Pages site (#110).
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch city geometry
        run: npm run fetch-data -- 2026

      - name: Fetch 2026 listings
        # 2026 listings are only available from the keyed API. Add the key as a
        # repository secret (Settings -> Secrets and variables -> Actions ->
        # BURNING_MAN_API_KEY); the fetcher enforces the location embargo before
        # anything is written, so nothing under embargo reaches the build.
        env:
          BURNING_MAN_API_KEY: ${{ secrets.BURNING_MAN_API_KEY }}
        run: npm run fetch-api -- 2026

      # The data this publishes is fetched here, so CI has never seen it: the
      # scheduled run pulls whatever Burning Man published this morning and
      # ships it. Every guard that matters lives in the suite — the derived
      # layout against the survey's own control points, the embargo, the
      # response shapes — and none of them ran on the only path that deploys.
      - name: Typecheck
        run: npm run typecheck

      - name: Test against the data being published
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Next.js's own incremental build cache. Keyed on the lockfile plus
      # every source file, so a dependency bump or any code change still gets
      # a correct (if partial-hit) cache rather than a stale one.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # A Pages project site is served from /<repo>/, so the build uses that
      # prefix. This is the one and only build: it is also the exact `out/`
      # directory the test suites below run against and the one uploaded to
      # Pages if they pass — against the exact freshly-fetched data this run
      # is about to publish, which a scheduled deploy has never seen before.
      #
      # There used to be two builds here — one with NEXT_PUBLIC_E2E=1 for the
      # browser suite to drive the map through a raw `window.__map` handle,
      # then a second, "real" build without that flag that only got a partial
      # retest (`test:smoke` was skipped against it outright, since the flag
      # that exposed the handle was compiled out). That meant the artifact
      # the suite fully tested and the artifact Pages actually served were
      # two different compiled outputs — issue #68's core finding — so a
      # regression scoped to the true production build could pass every test
      # and still ship. `window.__map` is now gated on a runtime flag
      # (`window.__DUST_COMPASS_E2E__`, see MapView.tsx) that only a test
      # harness's `page.addInitScript()` ever sets, not a build-time env var,
      # so one build now serves both jobs and there is nothing left for a
      # second round to catch that the first one couldn't.
      - name: Build (this is what gets published)
        run: |
          echo "::notice::Building production artifact. This is the exact build that will be uploaded to Pages if the tests below pass."
          NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}" \
          NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
          NEXT_PUBLIC_DATA_YEAR=2026 \
          npm run build

      - name: Start preview server
        id: start-server
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          node scripts/serve-export.mjs &
          npx wait-on -t 60000 "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      # Each browser-test suite is its own step (rather than one shell block
      # running all four in sequence) so that a failing test:smoke does not
      # stop test:a11y/test:ui/test:offline from also running and reporting
      # their own pass/fail in the Actions UI. GitHub Actions runs every
      # `run:` block under `bash -e`, which used to abort the whole block at
      # the first non-zero exit — that let real, unrelated bugs in the later
      # scripts (a broken theme switch, an undersized touch target) sit
      # invisible behind an earlier failure.
      #
      # Splitting the block into steps was not enough on its own (issue
      # #70): a step's `if:` fully replaces the implicit `success()` check
      # rather than adding to it, but only when that expression itself calls
      # a status-check function — a bare `steps.start-server.outcome ==
      # 'success'` still gets ANDed with the job's running success() behind
      # the scenes, so one suite failing here still skipped every suite after
      # it. `!cancelled()` makes that override explicit: each suite runs
      # whenever the server started, regardless of any earlier suite's
      # result, and only a genuine cancellation stops them.
      - name: Smoke tests
        if: ${{ !cancelled() && steps.start-server.outcome == 'success' }}
        run: npm run test:smoke "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: Accessibility tests
        if: ${{ !cancelled() && steps.start-server.outcome == 'success' }}
        run: npm run test:a11y "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: UI invariant tests
        if: ${{ !cancelled() && steps.start-server.outcome == 'success' }}
        run: npm run test:ui "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: Offline tests
        if: ${{ !cancelled() && steps.start-server.outcome == 'success' }}
        run: npm run test:offline "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      # No custom `if:` on this step or the two Pages steps below, so each
      # keeps the implicit `success()` gate: any suite above failing (or the
      # server never starting, or the build itself failing) skips straight
      # past artifact upload rather than publishing something untested.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore

      # Pages must already be switched on for the repo (Settings → Pages →
      # Source: GitHub Actions). Enabling it from here needs a token permission
      # the default GITHUB_TOKEN does not carry, so this only reads the config.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Verify deployed shell and branded assets
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$PAGE_URL" > page.html
          grep -q "/${REPO_NAME}/_next/" page.html
          ! grep -q '/burningman/' page.html
          curl --fail --silent --show-error --head "${PAGE_URL}og-image.png" | grep -qi 'content-type: image/png'
          curl --fail --silent --show-error "${PAGE_URL}manifest.webmanifest" | grep -q "\"start_url\":\"/${REPO_NAME}/\""
