name: Deploy

on:
  push:
    # Filtered to the default branch by the job's `if` rather than a hardcoded
    # name, so this keeps working if the branch is ever renamed or merged.
    branches: ['**']
  # Lets you publish by hand without pushing.
  workflow_dispatch:
  # The listings keep moving after the last commit, and nobody is at a laptop
  # once the event starts. Two things make this necessary rather than tidy:
  # art locations stay embargoed until Gates open, so on the morning of 30
  # August the map gains 329 pieces it could not legally show the day before;
  # and camps add, move and cancel events right through the week.
  #
  # 07:15 UTC is 00:15 in Black Rock City, a quarter of an hour after the art
  # embargo lifts. 19:15 UTC is midday there, which picks up the day's changes
  # before the evening everyone actually uses this.
  schedule:
    - cron: '15 7 * * *'
    - cron: '15 19 * * *'

# Pages needs these; nothing else in this workflow writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch city geometry
        run: npm run fetch-data -- 2026

      - name: Fetch 2026 listings
        # 2026 listings are only available from the keyed API. Add the key as a
        # repository secret (Settings -> Secrets and variables -> Actions ->
        # BURNING_MAN_API_KEY); the fetcher enforces the location embargo before
        # anything is written, so nothing under embargo reaches the build.
        env:
          BURNING_MAN_API_KEY: ${{ secrets.BURNING_MAN_API_KEY }}
        run: npm run fetch-api -- 2026

      # The data this publishes is fetched here, so CI has never seen it: the
      # scheduled run pulls whatever Burning Man published this morning and
      # ships it. Every guard that matters lives in the suite — the derived
      # layout against the survey's own control points, the embargo, the
      # response shapes — and none of them ran on the only path that deploys.
      - name: Typecheck
        run: npm run typecheck

      - name: Test against the data being published
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Next.js's own incremental build cache, shared by both builds below
      # (the second is a clean rebuild of the same code/data, so it benefits
      # from what the first one just populated). Keyed on the lockfile plus
      # every source file, so a dependency bump or any code change still gets
      # a correct (if partial-hit) cache rather than a stale one.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # A Pages project site is served from /<repo>/, so both builds below use
      # that prefix. Exported once with NEXT_PUBLIC_E2E so the browser suite
      # can drive the map the same way CI's build does, against the exact
      # freshly-fetched data this run is about to publish — a scheduled deploy
      # is precisely the run that has never seen this data before, so this is
      # the one point that can actually catch a bad response shape or a
      # rendering regression before it goes out.
      #
      # This E2E build is NEVER what gets uploaded to Pages — NEXT_PUBLIC_E2E
      # exposes a raw map handle on `window` for the test scripts to drive,
      # deliberately not something to ship. It is only a rehearsal build: the
      # real production build further down (without that flag) is a provably
      # different compiled artifact, so it gets the full suite run against it
      # again, below, before anything is uploaded.
      - name: Build (E2E test build — NOT published)
        run: |
          echo "::notice::Building with NEXT_PUBLIC_E2E=1 for browser/a11y/offline testing. This build will NOT be published."
          NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}" \
          NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
          NEXT_PUBLIC_DATA_YEAR=2026 \
          NEXT_PUBLIC_E2E=1 \
          npm run build

      # One server for the whole job: serve-export.mjs reads every file fresh
      # off disk per request rather than caching a snapshot, so once the
      # production build below overwrites `out/` in place, this same server
      # starts serving the production files with no restart needed — which
      # is exactly what lets the second test phase below test the real
      # published artifact instead of a stale copy of the first.
      #
      # Each browser-test suite is its own step (rather than one shell block
      # running all four in sequence) so that a failing test:smoke does not
      # stop test:a11y/test:ui/test:offline from also running and reporting
      # their own pass/fail in the Actions UI. GitHub Actions runs every
      # `run:` block under `bash -e`, which used to abort the whole block at
      # the first non-zero exit — that let real, unrelated bugs in the later
      # scripts (a broken theme switch, an undersized touch target) sit
      # invisible behind an earlier failure. Each test step below is gated on
      # the preview server having started successfully, not on the other test
      # steps, so one suite's failure can't hide another's.
      - name: Start preview server
        id: start-server
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          node scripts/serve-export.mjs &
          npx wait-on -t 60000 "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: Smoke tests (E2E test build)
        if: steps.start-server.outcome == 'success'
        run: npm run test:smoke "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: Accessibility tests (E2E test build)
        if: steps.start-server.outcome == 'success'
        run: npm run test:a11y "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: UI invariant tests (E2E test build)
        if: steps.start-server.outcome == 'success'
        run: npm run test:ui "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: Offline tests (E2E test build)
        if: steps.start-server.outcome == 'success'
        run: npm run test:offline "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      # This is the artifact that actually gets uploaded to Pages if the
      # retest below passes — a clean rebuild of the same code/data as the
      # E2E build above, minus the test-only flag. It is a provably different
      # compiled output (per issue #68), so nothing below is allowed to skip
      # straight to upload: the full suite runs again, against this exact
      # `out/` directory, before actions/upload-pages-artifact ever sees it.
      - name: Build (production — this is what gets published)
        id: build-production
        run: |
          echo "::notice::Building production artifact (no NEXT_PUBLIC_E2E). This is the exact build that will be uploaded to Pages if the tests below pass."
          NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}" \
          NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
          NEXT_PUBLIC_DATA_YEAR=2026 \
          npm run build

      # `steps.start-server.outcome` alone is not enough here the way it was
      # for the first round of tests above: a custom `if:` replaces the
      # default `success()` gate rather than adding to it, so without also
      # naming `build-production` these would still attempt to run against a
      # stale or half-written `out/` if the production build itself failed —
      # testing (and possibly passing against) exactly the build issue #68
      # says must never reach Pages untested.
      #
      # `test:smoke` does not run again here. `window.__map` — the raw
      # MapLibre handle nearly every one of its scenarios drives the map
      # through directly — is deliberately built only into the
      # `NEXT_PUBLIC_E2E=1` build above and never the real production one
      # (see MapView.tsx); against this build it can only time out waiting
      # for a handle that will never exist, not report anything about the
      # artifact itself. That first run above, moments earlier against the
      # same source with the one addition of that handle, is the genuine
      # coverage; `test:ui`'s one check with the same dependency degrades to
      # a SKIP here instead (see ui-invariants.mjs) rather than a guaranteed,
      # meaningless failure, and its other checks — along with a11y and
      # offline, neither of which ever needed the handle — still run for
      # real against this exact production `out/`.
      - name: Accessibility tests (production build — tested artifact)
        if: steps.start-server.outcome == 'success' && steps.build-production.outcome == 'success'
        run: npm run test:a11y "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: UI invariant tests (production build — tested artifact)
        if: steps.start-server.outcome == 'success' && steps.build-production.outcome == 'success'
        run: npm run test:ui "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: Offline tests (production build — tested artifact)
        if: steps.start-server.outcome == 'success' && steps.build-production.outcome == 'success'
        run: npm run test:offline "http://127.0.0.1:4173/${{ github.event.repository.name }}/"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore

      # Pages must already be switched on for the repo (Settings → Pages →
      # Source: GitHub Actions). Enabling it from here needs a token permission
      # the default GITHUB_TOKEN does not carry, so this only reads the config.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Verify deployed shell and branded assets
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$PAGE_URL" > page.html
          grep -q "/${REPO_NAME}/_next/" page.html
          ! grep -q '/burningman/' page.html
          curl --fail --silent --show-error --head "${PAGE_URL}og-image.png" | grep -qi 'content-type: image/png'
          curl --fail --silent --show-error "${PAGE_URL}manifest.webmanifest" | grep -q "\"start_url\":\"/${REPO_NAME}/\""
