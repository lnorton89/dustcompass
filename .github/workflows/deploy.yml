name: Deploy

on:
  push:
    # Filtered to the default branch by the job's `if` rather than a hardcoded
    # name, so this keeps working if the branch is ever renamed or merged.
    branches: ['**']
  # Lets you publish by hand without pushing.
  workflow_dispatch:
  # The listings keep moving after the last commit, and nobody is at a laptop
  # once the event starts. Two things make this necessary rather than tidy:
  # art locations stay embargoed until Gates open, so on the morning of 30
  # August the map gains 329 pieces it could not legally show the day before;
  # and camps add, move and cancel events right through the week.
  #
  # 07:15 UTC is 00:15 in Black Rock City, a quarter of an hour after the art
  # embargo lifts. 19:15 UTC is midday there, which picks up the day's changes
  # before the evening everyone actually uses this.
  schedule:
    - cron: '15 7 * * *'
    - cron: '15 19 * * *'

# Pages needs these; nothing else in this workflow writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch city geometry
        run: npm run fetch-data -- 2026

      - name: Fetch 2026 listings
        # 2026 listings are only available from the keyed API. Add the key as a
        # repository secret (Settings -> Secrets and variables -> Actions ->
        # BURNING_MAN_API_KEY); the fetcher enforces the location embargo before
        # anything is written, so nothing under embargo reaches the build.
        env:
          BURNING_MAN_API_KEY: ${{ secrets.BURNING_MAN_API_KEY }}
        run: npm run fetch-api -- 2026

      # The data this publishes is fetched here, so CI has never seen it: the
      # scheduled run pulls whatever Burning Man published this morning and
      # ships it. Every guard that matters lives in the suite — the derived
      # layout against the survey's own control points, the embargo, the
      # response shapes — and none of them ran on the only path that deploys.
      - name: Typecheck
        run: npm run typecheck

      - name: Test against the data being published
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Next.js's own incremental build cache, shared by both builds below
      # (the second is a clean rebuild of the same code/data, so it benefits
      # from what the first one just populated). Keyed on the lockfile plus
      # every source file, so a dependency bump or any code change still gets
      # a correct (if partial-hit) cache rather than a stale one.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # A Pages project site is served from /<repo>/, so both builds below use
      # that prefix. Exported once with NEXT_PUBLIC_E2E so the browser suite
      # can drive the map the same way CI's build does, against the exact
      # freshly-fetched data this run is about to publish — a scheduled deploy
      # is precisely the run that has never seen this data before, so this is
      # the one point that can actually catch a bad response shape or a
      # rendering regression before it goes out.
      - name: Build (for browser/a11y/offline testing)
        run: |
          NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}" \
          NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
          NEXT_PUBLIC_DATA_YEAR=2026 \
          NEXT_PUBLIC_E2E=1 \
          npm run build

      - name: Production browser, accessibility, and offline tests
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          node scripts/serve-export.mjs &
          npx wait-on -t 60000 "http://127.0.0.1:4173${NEXT_PUBLIC_BASE_PATH}/"
          npm run test:smoke "http://127.0.0.1:4173${NEXT_PUBLIC_BASE_PATH}/"
          npm run test:a11y "http://127.0.0.1:4173${NEXT_PUBLIC_BASE_PATH}/"
          npm run test:offline "http://127.0.0.1:4173${NEXT_PUBLIC_BASE_PATH}/"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore

      # The suite above ran against a build carrying NEXT_PUBLIC_E2E, which
      # exposes a raw map handle on `window` for the test scripts to drive —
      # deliberately not something to ship. Data/code are identical to what
      # was just proven working; only that debug flag differs, so this is a
      # clean rebuild rather than a reason to distrust the result above.
      - name: Build (for publishing)
        run: |
          NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}" \
          NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
          NEXT_PUBLIC_DATA_YEAR=2026 \
          npm run build

      # Pages must already be switched on for the repo (Settings → Pages →
      # Source: GitHub Actions). Enabling it from here needs a token permission
      # the default GITHUB_TOKEN does not carry, so this only reads the config.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Verify deployed shell and branded assets
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$PAGE_URL" > page.html
          grep -q "/${REPO_NAME}/_next/" page.html
          ! grep -q '/burningman/' page.html
          curl --fail --silent --show-error --head "${PAGE_URL}og-image.png" | grep -qi 'content-type: image/png'
          curl --fail --silent --show-error "${PAGE_URL}manifest.webmanifest" | grep -q "\"start_url\":\"/${REPO_NAME}/\""
