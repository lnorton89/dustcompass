name: Fix Directions swap rendering

on:
  push:
    branches: [feature/directions-132]
    paths: ['.github/workflows/fix-directions-swap.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/directions-132
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Patch endpoint picker
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'src/ui/DirectionsPanel.tsx'
          let text = fs.readFileSync(path, 'utf8')
          const before = `  return (\n    <Autocomplete\n      options={dynamicOptions}`
          const after = `  return (\n    <Autocomplete\n      // MUI keeps an internal text value separate from the selected option.\n      // When From/To are swapped programmatically that internal text can stay\n      // on the previous endpoint even though the controlled value changed.\n      // Remount only when the endpoint identity changes; typing keeps the same\n      // key, while swaps and external route restoration immediately render the\n      // new endpoint label instead of a stale field value.\n      key={value ? optionKey(value) : 'empty'}\n      options={dynamicOptions}`
          if (!text.includes(before)) throw new Error('DirectionsPanel target not found')
          text = text.replace(before, after)
          fs.writeFileSync(path, text)
          NODE
          git rm .github/workflows/fix-directions-swap.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/DirectionsPanel.tsx
          git commit -m "Fix stale Directions labels after endpoint swap"
          git push origin HEAD:feature/directions-132
