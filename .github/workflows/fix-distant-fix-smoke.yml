name: Fix distant-fix smoke

on:
  push:
    branches: [feature/directions-132]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/directions-132
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/fix-distant-fix-smoke.mjs
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-distant-fix-smoke.yml scripts/fix-distant-fix-smoke.mjs
          git add scripts/smoke.mjs
          git commit -m 'Align distant-fix smoke with live-route semantics'
          git push origin HEAD:feature/directions-132
