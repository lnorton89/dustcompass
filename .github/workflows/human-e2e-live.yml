name: Human E2E Live

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: human-e2e-live
  cancel-in-progress: false

jobs:
  journey:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # For an automatic post-deploy run, use the exact commit the Deploy
      # workflow published. A later master commit must not change the harness
      # underneath the site this job is evaluating.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run stateful human journeys against deployed Pages
        env:
          HUMAN_E2E_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run test:human

      - name: Upload human-journey failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: human-e2e-screenshots
          path: human-e2e-*.png
          if-no-files-found: ignore
