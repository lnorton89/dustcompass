name: Human E2E Live
on:
  push:
    branches: [audit/human-e2e-2026-08-25]
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run first-time phone journeys against deployed Pages site
        run: node scripts/human-e2e-phone-v3.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: human-e2e-screenshots
          path: human-*.png
          if-no-files-found: ignore
