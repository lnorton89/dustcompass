name: PR140 arrival latch lint patch

on:
  push:
    branches:
      - fix/directions-audit-134-139

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pr140-arrival-lint-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/directions-audit-134-139
          fetch-depth: 0
      - name: Make arrival latch destination-keyed and satisfy hook immutability
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()

          # The refreshed-destination effect must not mutate a ref that the later
          # arrival effect also owns. A destination-keyed latch naturally re-arms
          # when the authoritative coordinate changes, so no cross-effect reset
          # is needed.
          text = text.replace("      arrived.current = false\n", "", 1)
          text = text.replace("    arrived.current = false\n", "", 1)

          old = """  }, [data, heading?.address, heading?.name, heading?.position, heading?.uid, releaseLocation])"""
          new = """  }, [data, heading?.address, heading?.destinationAccuracy, heading?.name, heading?.position, heading?.uid, releaseLocation])"""
          assert text.count(old) == 1, ('refresh deps', text.count(old))
          text = text.replace(old, new)

          old = """  const arrived = useRef(false)\n  useEffect(() => {\n    if (!navigation || arrived.current || destinationRefreshPending.current) return"""
          new = """  const arrived = useRef<string>()\n  useEffect(() => {\n    if (!navigation || !heading || destinationRefreshPending.current) return\n    const arrivalKey = `${heading.position[0]},${heading.position[1]}`\n    if (arrived.current === arrivalKey) return"""
          assert text.count(old) == 1, ('arrival declaration', text.count(old))
          text = text.replace(old, new)

          old = """    arrived.current = true\n    haptic('arrive')"""
          new = """    arrived.current = arrivalKey\n    haptic('arrive')"""
          assert text.count(old) == 1, ('arrival latch', text.count(old))
          text = text.replace(old, new)

          # Existing explicit route-start resets remain valid and ensure
          # restarting navigation to the same destination can notify again.
          text = text.replace("    arrived.current = false\n", "    arrived.current = undefined\n")
          text = text.replace("      arrived.current = false\n", "      arrived.current = undefined\n")

          p.write_text(text)
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr140-arrival-lint-patch.yml
          git add src/App.tsx
          git commit -m "Key arrival latch to authoritative destination [pr140-arrival-lint-patched]"
          git push origin HEAD:fix/directions-audit-134-139
