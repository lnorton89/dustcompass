name: PR140 arrival latch type patch

on:
  push:
    branches:
      - fix/directions-audit-134-139

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pr140-arrival-type-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/directions-audit-134-139
          fetch-depth: 0
      - name: Correct arrival latch ref type
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()
          old = '  const arrived = useRef<string>()'
          new = '  const arrived = useRef<string | undefined>(undefined)'
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new))
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr140-arrival-type-patch.yml
          git add src/App.tsx
          git commit -m "Fix arrival latch ref typing [pr140-arrival-type-patched]"
          git push origin HEAD:fix/directions-audit-134-139
