name: PR140 final cleanup patch

on:
  push:
    branches:
      - fix/directions-audit-134-139

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pr140-cleanup-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/directions-audit-134-139
          fetch-depth: 0
      - name: Remove dead helper left by route-card refactor
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/ui/routeCard.ts')
          text = p.read_text()
          dead = """function drawPolyline(ctx: CanvasRenderingContext2D, positions: Position[], project: (p: Position) => { x: number; y: number }) {\n  if (positions.length < 2) return\n  const first = project(positions[0])\n  ctx.beginPath()\n  ctx.moveTo(first.x, first.y)\n  for (const position of positions.slice(1)) {\n    const point = project(position)\n    ctx.lineTo(point.x, point.y)\n  }\n  ctx.stroke()\n}\n\n"""
          assert text.count(dead) == 1, text.count(dead)
          p.write_text(text.replace(dead, ''))
      - name: Commit cleanup and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr140-cleanup-patch.yml
          git add src/ui/routeCard.ts
          git commit -m "Remove dead route-card drawing helper [pr140-cleanup-patched]"
          git push origin HEAD:fix/directions-audit-134-139
