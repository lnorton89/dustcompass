name: PR140 final gap patch

on:
  push:
    branches:
      - fix/directions-audit-134-139

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pr140-final-gap-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/directions-audit-134-139
          fetch-depth: 0
      - name: Apply final audit fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          old = """  useEffect(() => {\n    if (!directionsOpen || !directionsTo) return\n    const next = directionsUrl({\n      version: 1,\n      from: directionsFrom,\n      to: directionsTo,\n      mode: directionsMode,\n    })\n    if (next !== window.location.href) window.history.replaceState(null, '', next)\n  }, [directionsOpen, directionsFrom, directionsTo, directionsMode])"""
          new = """  useEffect(() => {\n    if (!directionsOpen) return\n    if (!directionsTo) {\n      // #155: an incomplete editor must not leave a previously complete route\n      // serialized in the address bar. Otherwise clearing To is undone by a\n      // reload/share of the stale URL.\n      const next = new URL(window.location.href)\n      next.search = ''\n      next.hash = ''\n      if (next.toString() !== window.location.href) window.history.replaceState(null, '', next)\n      return\n    }\n    const next = directionsUrl({\n      version: 1,\n      from: directionsFrom,\n      to: directionsTo,\n      mode: directionsMode,\n    })\n    if (next !== window.location.href) window.history.replaceState(null, '', next)\n  }, [directionsOpen, directionsFrom, directionsTo, directionsMode])"""
          assert text.count(old) == 1, ('directions URL effect', text.count(old))
          text = text.replace(old, new)

          old = """  useEffect(() => {\n    if (!heading?.uid || !data) return\n    const latest = data.pois.find((poi) => poi.uid === heading.uid)\n    if (!latest) {\n      const id = requestAnimationFrame(() => { setProbe('This navigation destination is no longer in the current map.'); setHeading(undefined); releaseLocation('navigation') })\n      return () => cancelAnimationFrame(id)\n    }\n    if (latest.position[0] === heading.position[0] && latest.position[1] === heading.position[1] && latest.name === heading.name && latest.address === heading.address) return\n    const id = requestAnimationFrame(() => { setHeading((current) => current?.uid === latest.uid ? { ...current, name: latest.name, position: latest.position, address: latest.address, approximate: latest.accuracyClass === 'derived' } : current) })\n    return () => cancelAnimationFrame(id)\n  }, [data, heading?.address, heading?.name, heading?.position, heading?.uid, releaseLocation])"""
          new = """  // While a refreshed POI is being reconciled, arrival must not evaluate the\n  // obsolete coordinate from the previous dataset for one more effect pass.\n  const destinationRefreshPending = useRef(false)\n  useEffect(() => {\n    if (!heading?.uid || !data) {\n      destinationRefreshPending.current = false\n      return\n    }\n    const latest = data.pois.find((poi) => poi.uid === heading.uid)\n    if (!latest) {\n      destinationRefreshPending.current = true\n      arrived.current = false\n      const id = requestAnimationFrame(() => {\n        setProbe('This navigation destination is no longer in the current map.')\n        setHeading(undefined)\n        destinationRefreshPending.current = false\n        releaseLocation('navigation')\n      })\n      return () => cancelAnimationFrame(id)\n    }\n    if (latest.position[0] === heading.position[0] && latest.position[1] === heading.position[1] && latest.name === heading.name && latest.address === heading.address) {\n      destinationRefreshPending.current = false\n      return\n    }\n    // #152: reset the one-shot arrival latch as soon as the authoritative POI\n    // moves, and suppress arrival until heading.position has caught up.\n    destinationRefreshPending.current = true\n    arrived.current = false\n    const id = requestAnimationFrame(() => {\n      setHeading((current) => current?.uid === latest.uid ? { ...current, name: latest.name, position: latest.position, address: latest.address, approximate: latest.accuracyClass === 'derived' } : current)\n      destinationRefreshPending.current = false\n    })\n    return () => cancelAnimationFrame(id)\n  }, [data, heading?.address, heading?.name, heading?.position, heading?.uid, releaseLocation])"""
          assert text.count(old) == 1, ('POI refresh effect', text.count(old))
          text = text.replace(old, new)

          old = """    if (!navigation || arrived.current) return"""
          new = """    if (!navigation || arrived.current || destinationRefreshPending.current) return"""
          assert text.count(old) == 1, ('arrival gate', text.count(old))
          text = text.replace(old, new)

          old = """  useEffect(() => {\n    if (!navigationRetrying || !locationWatchHasFailed(location.status)) return\n    const id = requestAnimationFrame(() => {\n      setNavigationRetrying(false)\n      releaseLocation('navigation')\n    })\n    return () => cancelAnimationFrame(id)\n  }, [location.status, navigationRetrying, releaseLocation])"""
          new = """  useEffect(() => {\n    if (!navigationRetrying) return\n    // A successful browser fix can still be unusable for a BRC route. Treat\n    // that as a completed retry too; otherwise an off-playa fix leaves the\n    // retry watch running indefinitely while the route correctly stays at Man.\n    const outsideCity = location.status === 'tracking' && Boolean(here) && !usableFix\n    if (!locationWatchHasFailed(location.status) && !outsideCity) return\n    const id = requestAnimationFrame(() => {\n      setNavigationRetrying(false)\n      releaseLocation('navigation')\n    })\n    return () => cancelAnimationFrame(id)\n  }, [here, location.status, navigationRetrying, releaseLocation, usableFix])"""
          assert text.count(old) == 1, ('retry terminal effect', text.count(old))
          text = text.replace(old, new)
          app.write_text(text)

          smoke = Path('scripts/smoke.mjs')
          text = smoke.read_text()
          marker = """assert((await sharedRoute.getByTestId('directions-summary').count()) === 1, 'shared Directions URL restores route summary')\nawait sharedRoute.close()"""
          addition = """assert((await sharedRoute.getByTestId('directions-summary').count()) === 1, 'shared Directions URL restores route summary')\nawait sharedRoute.close()\n\n// #155: clearing To must clear the serialized route too. A reload must not\n// resurrect the destination the editor visibly removed.\nconst clearedRoute = await context.newPage()\nawait clearedRoute.goto(routeUrl, { waitUntil: 'load' })\nawait clearedRoute.waitForFunction(() => window.__map, null, { timeout: 30000 })\nawait clearedRoute.getByRole('heading', { name: 'Directions' }).waitFor({ timeout: 5000 })\nconst clearedTo = clearedRoute.getByRole('combobox', { name: 'To' })\nawait clearedTo.locator('xpath=..').getByLabel('Clear').click()\nawait clearedRoute.waitForTimeout(300)\nassert(!new URL(clearedRoute.url()).searchParams.has('to'), 'clearing To removes the stale destination from the URL (#155)')\nassert(!new URL(clearedRoute.url()).searchParams.has('dir'), 'an incomplete Directions editor no longer advertises a complete route (#155)')\nawait clearedRoute.reload({ waitUntil: 'load' })\nawait clearedRoute.waitForFunction(() => window.__map, null, { timeout: 30000 })\nawait clearedRoute.getByRole('button', { name: 'Directions', exact: true }).first().click()\nawait clearedRoute.getByRole('heading', { name: 'Directions' }).waitFor({ timeout: 5000 })\nassert((await clearedRoute.getByRole('combobox', { name: 'To' }).inputValue()) === '', 'reloading after clearing To does not restore the removed destination (#155)')\nawait clearedRoute.close()"""
          assert text.count(marker) == 1, ('smoke marker', text.count(marker))
          text = text.replace(marker, addition)
          smoke.write_text(text)

      - name: Commit final patch and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr140-final-gap-patch.yml
          git add src/App.tsx scripts/smoke.mjs
          git commit -m "Close final Directions audit gaps including #155 [pr140-final-gap-patched]"
          git push origin HEAD:fix/directions-audit-134-139
