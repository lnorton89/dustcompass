name: Sync human fixes with master
on:
  push:
    branches: [fix/human-e2e-findings-119-121]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[master-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/human-e2e-findings-119-121
          fetch-depth: 0
      - run: |
          git fetch origin master
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/master
          git commit --allow-empty -m "chore: sync human fixes with current master [master-synced]"
          git push origin HEAD:fix/human-e2e-findings-119-121
