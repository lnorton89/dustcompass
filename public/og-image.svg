<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Dust Compass — Find your way, even offline.</title>
  <desc id="desc">A warm, original compass identity for the offline playa map.</desc>
  <defs>
    <radialGradient id="dust" cx="66%" cy="30%" r="85%">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#e8e0cf"/>
    </radialGradient>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="10" r="1" fill="#12100e" opacity=".045"/>
      <circle cx="29" cy="25" r="1.4" fill="#12100e" opacity=".035"/>
      <circle cx="15" cy="37" r=".8" fill="#12100e" opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#dust)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>
  <rect x="0" y="0" width="18" height="630" fill="#ff8a4c"/>
  <rect x="18" y="0" width="7" height="630" fill="#5ec8d8"/>

  <g transform="translate(78 65)">
    <rect width="76" height="76" rx="18" fill="#12100e"/>
    <circle cx="38" cy="38" r="24" fill="none" stroke="#5ec8d8" stroke-width="3"/>
    <path d="M38 14v10M38 52v10M14 38h10M52 38h10" stroke="#5ec8d8" stroke-width="3" stroke-linecap="round"/>
    <path d="m38 24 7 17-7-3-7 3 7-17Z" fill="#ff8a4c"/>
    <path d="M22 48c8-4 24-4 32 0" fill="none" stroke="#e8e0cf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="38" r="3" fill="#e8e0cf"/>
  </g>

  <text x="175" y="103" fill="#12100e" font-family="Inter, Segoe UI, sans-serif" font-weight="800" font-size="39" letter-spacing="-.8">DUST COMPASS</text>
  <text x="177" y="133" fill="#766c5b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" font-size="15" letter-spacing="2.6">OFFLINE PLAYA NAVIGATION</text>

  <text x="78" y="276" fill="#12100e" font-family="Inter, Segoe UI, sans-serif" font-weight="800" font-size="70" letter-spacing="-2.6">Find your way,</text>
  <text x="78" y="352" fill="#12100e" font-family="Inter, Segoe UI, sans-serif" font-weight="800" font-size="70" letter-spacing="-2.6">even offline.</text>
  <text x="82" y="411" fill="#584f42" font-family="Inter, Segoe UI, sans-serif" font-weight="500" font-size="27">Map places. Find events. Follow a bearing home.</text>

  <g transform="translate(925 300)">
    <circle cx="0" cy="0" r="128" fill="none" stroke="#12100e" stroke-width="2" opacity=".12"/>
    <circle cx="0" cy="0" r="91" fill="none" stroke="#5ec8d8" stroke-width="5"/>
    <circle cx="0" cy="0" r="59" fill="none" stroke="#12100e" stroke-width="2" opacity=".22"/>
    <path d="M0-128v37M0 91v37M-128 0h37M91 0h37" stroke="#5ec8d8" stroke-width="5" stroke-linecap="round"/>
    <path d="m0-91 30 105L0 0l-30 14L0-91Z" fill="#ff8a4c"/>
    <path d="M-77 51c39-17 115-17 154 0" fill="none" stroke="#12100e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#12100e"/>
    <circle cx="0" cy="0" r="5" fill="#e8e0cf"/>
  </g>

  <g transform="translate(78 532)">
    <rect width="1044" height="1" fill="#12100e" opacity=".18"/>
    <circle cx="8" cy="43" r="5" fill="#ff8a4c"/>
    <text x="24" y="50" fill="#584f42" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="600">FREE COMMUNITY TOOL · NOT AFFILIATED WITH BURNING MAN PROJECT</text>
  </g>
</svg>
